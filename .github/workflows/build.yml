name: Build OpenWrt for Redmi AX3000

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # 支持手动触发

env:
  REPO_URL: https://github.com/hzyitc/openwrt-redmi-ax3000
  REPO_BRANCH: master
  TARGET: ipq50xx
  SUBTARGET: arm
  DEVICE: redmi_ax3000

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file

      - name: 更新并安装 feeds
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成默认配置（Redmi AX3000）
        shell: bash
        run: |
          make defconfig
          echo "CONFIG_TARGET_${TARGET}=y" >> .config
          echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y" >> .config
          echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_redmi_ax3000=y" >> .config
          make defconfig

      - name: 下载源代码
        shell: bash
        run: |
          make -j$(nproc) download V=s
          find dl -size -1024c -exec ls -lh {} \; 2>/dev/null
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        shell: bash
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log

      - name: 上传编译日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: 整理固件输出
        shell: bash
        run: |
          mkdir -p firmware
          find bin/targets/ -name "*.ubi" -o -name "*.bin" -o -name "*.tar" | while read f; do
            cp "$f" firmware/
          done
          echo "=== 固件文件清单 ==="
          ls -lh firmware/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware
          path: firmware/
